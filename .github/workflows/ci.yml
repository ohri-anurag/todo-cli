name: CI

on:
  push:
    branches: [ master ]
    tags:
      - v**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
    steps:
      - name: Clone the repo
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run CI using docker
        run: |
          docker pull ghcr.io/ohri-anurag/ci:latest
          docker compose run --name ci-ci ci
      - name: Get the current version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Release todo
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker container cp ci-ci:/build-cache/build/x86_64-linux/ghc-9.12.4/todo-cli-${{ env.VERSION }}/x/todo/build/todo/todo ./
      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated todo release for version ${{ github.ref_name }}" \
            todo
