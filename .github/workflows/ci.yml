name: CI

on:
  push:
    branches: [ master ]
    tags:
      - v**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
    steps:
      - name: Clone the repo
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run CI using docker
        run: |
          docker pull ghcr.io/ohri-anurag/ci:latest
          docker run -v ./:/ci ghcr.io/ohri-anurag/ci:latest bash -c 'cd /root/.cache/cabal/packages/hackage.haskell.org && gzip -d 01-index.tar.gz && cd /ci && cabal build --builddir=/build-cache && cabal test --builddir=/build-cache'
      - name: Get the current version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Release todo
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker container cp $(docker container list -qa):/build-cache/build/x86_64-linux/ghc-9.12.4/todo-cli-${{ env.VERSION }}/x/todo/build/todo/todo ./
          ./todo --bash-completion-script ./todo > todo_completion.sh
          tar -cvzf todo.tar.gz todo todo_completion.sh

      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated todo release for version ${{ github.ref_name }}" \
            todo.tar.gz
