name: CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Clone the repo
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run CI using docker
        run: |
          docker pull ghcr.io/ohri-anurag/ci:latest
          docker run -v ./:/ci ghcr.io/ohri-anurag/ci:latest bash -c 'cabal build --builddir=/build-cache && cabal test --builddir=/build-cache'
      - name: Release todo
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker container cp $(docker container list -qa):/build-cache/build/x86_64-linux/ghc-9.12.3/todo-cli-0.1.0.0/x/todo/build/todo/todo ./
      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated todo release for version ${{ github.ref_name }}" \
            todo
