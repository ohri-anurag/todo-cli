services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  ci:
    image: ghcr.io/ohri-anurag/ci:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_CONN_STRING: postgresql://postgres@postgres:5432/postgres
    volumes:
      - ./:/ci
    command: >
      bash -c '
        cd /root/.cache/cabal/packages/hackage.haskell.org &&
        gzip -d 01-index.tar.gz 2>/dev/null || true &&
        cd /ci &&
        cabal build --builddir=/build-cache --enable-executable-static \
          --ghc-option='-optl=-lpgport' \
          --ghc-option='-optl=-lpgport_shlib' \
          --ghc-option='-optl=-lpgcommon' \
          --ghc-option='-optl=-lpgcommon_shlib' \
          --ghc-option='-optl=-lpq' \
          --ghc-option='-optl=-lcrypto' \
          --ghc-option='-optl=-lssl' &&
        cabal test --builddir=/build-cache
      '
